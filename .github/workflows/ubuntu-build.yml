name: Ubuntu 24.04 CaptureForge DEB
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'packaging/linux/**'
      - '.github/workflows/ubuntu-build.yml'
  push:
    branches: [feature/ubuntu-2404, main]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'packaging/linux/**'
      - '.github/workflows/ubuntu-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and OCR libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ git qt6-base-dev qt6-svg-dev qt6-tools-dev libgl1-mesa-dev libx11-dev libxcb1-dev libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-x11-dev libxkbcommon-dev libx11-xcb-dev libxcb-cursor-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-sync-dev tesseract-ocr tesseract-ocr-eng xvfb xauth
      - name: Configure native Qt build
        run: cmake -S . -B build-ubuntu -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Compile CaptureForge
        run: cmake --build build-ubuntu --parallel 2
      - name: OCR and desktop startup tests under X11
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a ./build-ubuntu/CaptureForge --ocr-self-test
          xvfb-run -a ./build-ubuntu/CaptureForge --smoke-test
      - name: Build Ubuntu package
        run: bash packaging/linux/build-deb.sh
      - name: Publish Ubuntu package to existing versioned GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.3 >/dev/null
          gh release upload v1.0.3 installer/linux/*.deb installer/linux/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CaptureForge-Ubuntu-24.04-amd64
          path: |
            installer/linux/*.deb
            installer/linux/*.sha256
          if-no-files-found: error
